
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PICKIT | 대학생 실시간 투표</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <h1 class="logo">PICKIT<span>.</span></h1>
            <div id="user-menu" class="hidden">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn secondary">
                    로그아웃
                </button>
            </div>
        </div>
    </header>

    <main class="container">

        <div id="notice" class="notice hidden"
             role="status" aria-live="polite"></div>

        <!-- 로그인 / 회원가입 -->
        <section id="auth-section" class="auth-card">
            <h2>학교생활의 선택을 더 쉽게</h2>
            <p class="muted">
                로그인하고 우리 학과의 투표에 참여하세요.
            </p>

            <div class="tabs">
                <button id="login-tab" class="tab active">
                    로그인
                </button>
                <button id="register-tab" class="tab">
                    회원가입
                </button>
            </div>

            <form id="login-form" class="form">
                <label for="login-username">아이디</label>
                <input id="login-username" required
                       autocomplete="username">

                <label for="login-password">비밀번호</label>
                <input id="login-password" type="password"
                       required autocomplete="current-password">

                <button class="btn primary" type="submit">
                    로그인
                </button>
            </form>

            <form id="register-form" class="form hidden">
                <label for="register-username">아이디</label>
                <input id="register-username" minlength="4"
                       maxlength="30" required
                       autocomplete="username">

                <label for="register-password">비밀번호</label>
                <input id="register-password" type="password"
                       minlength="8" required
                       autocomplete="new-password">

                <label for="register-nickname">닉네임</label>
                <input id="register-nickname" maxlength="20"
                       required>

                <label for="register-department">소속 학과</label>
                <select id="register-department" required>
                    <option value="">학과 선택</option>
                    <option>컴퓨터공학과</option>
                    <option>경영학과</option>
                    <option>디자인학과</option>
                    <option>전자공학과</option>
                </select>

                <button class="btn primary" type="submit">
                    회원가입
                </button>
            </form>
        </section>

        <!-- 로그인 이후 화면 -->
        <section id="dashboard" class="hidden">
            <div class="welcome">
                <div>
                    <h2>안녕하세요, <span id="nickname"></span>님!</h2>
                    <p id="department-name" class="muted"></p>
                </div>
                <button id="show-create-btn" class="btn primary">
                    + 새 투표 만들기
                </button>
            </div>

            <!-- 투표 생성 -->
            <section id="create-section" class="panel hidden">
                <h3>새 투표 만들기</h3>

                <form id="create-form" class="form">
                    <label for="poll-title">투표 제목</label>
                    <input id="poll-title" required
                           placeholder="예: 학과 MT 장소 선정">

                    <label for="poll-deadline">마감 시간</label>
                    <input id="poll-deadline" type="datetime-local"
                           required>

                    <label for="poll-target">참여 대상</label>
                    <select id="poll-target">
                        <option value="">전체 학생</option>
                        <option id="my-dept-option" value="">
                            내 학과 학생만
                        </option>
                    </select>

                    <label>투표 선택지 (2~10개)</label>
                    <div id="option-inputs">
                        <input class="poll-option"
                               placeholder="선택지 1" required>
                        <input class="poll-option"
                               placeholder="선택지 2" required>
                    </div>

                    <button id="add-option-btn" type="button"
                            class="btn secondary">
                        + 선택지 추가
                    </button>

                    <div class="actions">
                        <button type="submit" class="btn primary">
                            투표 생성
                        </button>
                        <button id="cancel-create-btn" type="button"
                                class="btn secondary">
                            취소
                        </button>
                    </div>
                </form>
            </section>

            <!-- 투표 목록 -->
            <section class="polls-section">
                <div class="section-heading">
                    <h3>참여 가능한 투표</h3>
                    <button id="refresh-btn" class="btn secondary">
                        새로고침
                    </button>
                </div>

                <div id="poll-list" class="poll-grid"></div>
            </section>

            <!-- 투표 상세 -->
            <section id="detail-section" class="panel hidden">
                <button id="back-btn" class="back-btn">
                    ← 목록으로 돌아가기
                </button>

                <h2 id="detail-title"></h2>
                <p id="detail-info" class="muted"></p>

                <form id="vote-form" class="form">
                    <div id="vote-options"></div>
                    <button id="vote-btn" type="submit"
                            class="btn primary">
                        투표하기
                    </button>
                </form>

                <div class="results-heading">
                    <h3>실시간 투표 결과</h3>
                    <span id="total-votes"></span>
                </div>

                <div id="results-list"></div>
            </section>
        </section>

    </main>
</body>
</html>
